; SekiroPerf settings. Changes apply the next time the game starts.
; What happened at startup is written to sekiro_perf.log next to this file.

[Upscaling]
; Render the game at the in-game resolution and upscale it to your monitor's native resolution
; with AMD FSR 1.0. This is where the big FPS gains come from, but ONLY if you set the in-game
; resolution below native (see README). The game runs as borderless fullscreen while this is on.
Enable=1
; FSR sharpening, 0.0 (subtle) to 1.0 (strongest).
Sharpness=0.8

[FrameRate]
; Remove Sekiro's 60 FPS cap. Includes the movement speed fix, so running speed stays correct.
UnlockFps=1
; New frame rate cap, 30-300. 0 = your monitor's refresh rate.
; Going above your refresh rate only helps with DisableVSync=1.
TargetFps=0

[Display]
; Sekiro forces 60 Hz in exclusive fullscreen. 1 = use the monitor's highest refresh rate.
; (Only matters with [Upscaling] Enable=0. Upscaling is always borderless at desktop refresh.)
ForceHighestRefreshRate=1
; Sekiro forces VSync. 1 = turn it off. Recommended with G-Sync/FreeSync: also set TargetFps
; a few below your refresh rate (e.g. 141 on 144 Hz). Without VRR this causes tearing.
DisableVSync=0

[System]
; Ask Windows for 1 ms timer resolution so frame pacing is more even.
HighResolutionTimer=1
; Seconds to wait for the game's code to unpack before giving up on the FPS unlock.
ScanTimeoutSeconds=120

[Loader]
; Optional: another dinput8-style DLL mod to load, relative to this folder (e.g. \other_mod.dll).
; Use this if Mod Engine's chainDInput8DLLPath was already used by another mod.
ChainDLL=
