name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Unit tests
        run: make test

      - name: Build
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: SekiroPerf
          path: dist/SekiroPerf/
